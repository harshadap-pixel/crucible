# ── Benchmark: Structured Extraction ─────────────────────────────────────────
# Mirrors benchmark/benchmark_tasks.jsonl task_type=extraction
# Baseline: mock scores 1.0 on both (returns perfect JSON)
# Hardest task type — tests JSON output discipline and field accuracy

[suite]
name                 = "Benchmark — Structured Extraction"
model                = "llama3.1:8b"
judge                = "llama3.1:8b"
category             = "benchmark"
concurrency          = 2
n_runs               = 3
regression_threshold = 0.10

[[tests]]
name        = "ext-001-invoice"
description = "Extract invoice fields as JSON — mock scores 1.0"
prompt      = """\
Extract structured fields from the following text and return ONLY valid JSON. \
No markdown, no explanation, no extra keys.\n\n\
Text: Invoice INV-2048 for customer Priya Menon, total $428.75, issued on 2026-02-11.\n\n\
Required fields: invoice_id, customer, amount, date"""

assert = [
  { type = "json_schema", schema = '{"type":"object","required":["invoice_id","customer","amount","date"]}', weight = 3.0 },
  { type = "contains",    value = "INV-2048",    weight = 2.0 },
  { type = "contains",    value = "Priya Menon", weight = 2.0 },
  { type = "contains",    value = "428.75",      weight = 2.0 },
  { type = "contains",    value = "2026-02-11",  weight = 2.0 },
  { type = "llm_judge",
    rubric    = "JSON must contain invoice_id='INV-2048', customer='Priya Menon', amount=428.75, date='2026-02-11'. No extra fields. No markdown wrapping.",
    threshold = 0.85,
    weight    = 1.0 },
]

[[tests]]
name        = "ext-002-order"
description = "Extract order fields as JSON — mock scores 1.0"
prompt      = """\
Extract structured fields from the following text and return ONLY valid JSON. \
No markdown, no explanation, no extra keys.\n\n\
Text: Order #A-991 by Jordan Lee costs $99.00 and was placed on 2026-01-30.\n\n\
Required fields: order_id, customer, amount, date"""

assert = [
  { type = "json_schema", schema = '{"type":"object","required":["order_id","customer","amount","date"]}', weight = 3.0 },
  { type = "contains",    value = "A-991",       weight = 2.0 },
  { type = "contains",    value = "Jordan Lee",   weight = 2.0 },
  { type = "contains",    value = "99",           weight = 2.0 },
  { type = "contains",    value = "2026-01-30",   weight = 2.0 },
  { type = "llm_judge",
    rubric    = "JSON must contain order_id='A-991', customer='Jordan Lee', amount=99.0, date='2026-01-30'. No markdown wrapping.",
    threshold = 0.85,
    weight    = 1.0 },
]
