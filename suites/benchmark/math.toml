# ── Benchmark: Math ──────────────────────────────────────────────────────────

[suite]
name                 = "Benchmark — Math Reasoning"
model                = "llama3.1:8b"
judge                = "llama3.1:8b"
category             = "benchmark"
concurrency          = 2
n_runs               = 3
regression_threshold = 0.10

[[tests]]
name        = "math-001-multiplication"
description = "17 * 19 = 323"
prompt      = "What is 17 * 19? Return only the final number, no explanation."
assert = [
  { type = "contains",  value = "323", weight = 3.0 },
  { type = "regex",     value = "\\b323\\b" },
  { type = "llm_judge", rubric = "Response must contain only the number 323 with no extra text.", threshold = 0.9, weight = 1.0 },
]

[[tests]]
name        = "math-002-hours"
description = "24h * 30 days = 720 hours"
prompt      = "If a service runs 24 hours per day for 30 days, how many total hours is that? Return only the final number, no explanation."
assert = [
  { type = "contains",  value = "720", weight = 3.0 },
  { type = "regex",     value = "\\b720\\b" },
  { type = "llm_judge", rubric = "Response must contain only the number 720 with no extra text.", threshold = 0.9, weight = 1.0 },
]
