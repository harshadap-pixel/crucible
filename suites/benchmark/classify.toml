# ── Benchmark: Sentiment Classification ──────────────────────────────────────

[suite]
name                 = "Benchmark — Sentiment Classification"
model                = "llama3.1:8b"
judge                = "llama3.1:8b"
category             = "benchmark"
concurrency          = 2
n_runs               = 3
regression_threshold = 0.10

[[tests]]
name        = "cls-001-positive"
description = "Positive sentiment review"
prompt      = "Classify the sentiment of the following text. Reply with ONLY one word: positive or negative.\n\nText: The app is fast and the new dashboard is very useful."
assert = [
  { type = "contains",     value = "positive", weight = 2.0 },
  { type = "not_contains", value = "negative" },
  { type = "regex",        value = "(?i)^positive" },
]

[[tests]]
name        = "cls-002-negative"
description = "Negative sentiment review"
prompt      = "Classify the sentiment of the following text. Reply with ONLY one word: positive or negative.\n\nText: Frequent timeouts and poor support made this unusable."
assert = [
  { type = "contains",     value = "negative", weight = 2.0 },
  { type = "not_contains", value = "positive" },
  { type = "regex",        value = "(?i)^negative" },
]
