# ── Multi-turn conversation tests ─────────────────────────────────────────────
# Demonstrates multi-turn (context-retention) testing.
#
# How it works:
#   `turns` are replayed in order as the conversation history.
#   `prompt` is the FINAL user message sent after the history.
#   The model must remember what was established earlier in the conversation.
#
# Turn roles: "user" | "assistant"
# The runner calls chat_with_history() on Ollama.
#
# Run:
#   crucible run suites/examples/multi_turn.toml

[suite]
name        = "Multi-Turn Context Retention"
model       = "llama3.1:8b"
judge       = "llama3.1:8b"
concurrency = 2
n_runs      = 2   # run twice; context failures are usually consistent

# ── Test 1: name recall ────────────────────────────────────────────────────────
[[tests]]
name        = "remember-user-name"
description = "Model must recall the user's name from earlier in the conversation"
turns = [
    { role = "user",      content = "Hi, my name is Marcus." },
    { role = "assistant", content = "Hello Marcus! How can I help you today?" },
    { role = "user",      content = "I'm working on a Python project." },
    { role = "assistant", content = "Great! I'd be happy to help with your Python project, Marcus." },
]
prompt = "What is my name?"
assert = [
    { type = "contains",  value = "Marcus" },
    { type = "llm_judge", rubric = "The response correctly identifies the user's name as Marcus", threshold = 0.8 },
]

# ── Test 2: preference tracking ───────────────────────────────────────────────
[[tests]]
name        = "recall-stated-preference"
description = "Model must remember a preference set earlier"
turns = [
    { role = "user",      content = "I prefer concise answers — no more than 2 sentences." },
    { role = "assistant", content = "Understood! I'll keep my responses brief and to the point." },
    { role = "user",      content = "What is machine learning?" },
    { role = "assistant", content = "Machine learning is a subset of AI where systems learn patterns from data. Models improve their performance over time without being explicitly programmed." },
]
prompt = "Did I tell you any preference about how I want answers?"
assert = [
    { type = "contains",  value = "concise"   },
    { type = "contains",  value = "sentence"  },
]

# ── Test 3: topic continuity ───────────────────────────────────────────────────
[[tests]]
name        = "sql-topic-continuity"
description = "Model answers a follow-up about a SQL query discussed earlier"
turns = [
    { role = "user",      content = "Here's a SQL query: SELECT * FROM users WHERE active = true" },
    { role = "assistant", content = "That query selects all columns from the users table where the active flag is true." },
]
prompt = "How would you add a LIMIT clause to the query we discussed?"
assert = [
    { type = "contains",    value = "LIMIT"  },
    { type = "not_contains", value = "sorry"  },  # model shouldn't forget the context
    { type = "llm_judge",
      rubric    = "The response adds a LIMIT clause to a SELECT query and shows correct SQL syntax",
      threshold = 0.75 },
]

# ── Test 4: long context (5 turns) ────────────────────────────────────────────
[[tests]]
name        = "five-turn-recall"
description = "Recall a number introduced 5 turns ago"
turns = [
    { role = "user",      content = "Remember this number: 7391." },
    { role = "assistant", content = "Got it! I'll remember the number 7391." },
    { role = "user",      content = "What's the weather like in general in winter?" },
    { role = "assistant", content = "Winter generally brings cold temperatures, shorter days, and in many regions, snow or rain." },
    { role = "user",      content = "How do databases index data?" },
    { role = "assistant", content = "Databases use B-tree or hash indexes to speed up lookups by maintaining a sorted or hashed structure of column values." },
    { role = "user",      content = "Can you name a few programming languages?" },
    { role = "assistant", content = "Sure: Python, Rust, Go, TypeScript, and Java are popular choices." },
]
prompt = "What number did I ask you to remember at the start of our conversation?"
assert = [
    { type = "contains",  value = "7391"  },
]
