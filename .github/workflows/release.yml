name: Release

on:
  push:
    branches: [main]

# Skip if this push is the bot's own version-bump commit
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    # Don't loop: skip the commit the bot just pushed
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version in Cargo.toml
        id: version
        run: |
          # Extract version robustly — handles 'version = "x"' or 'version     = "x"'
          CURRENT=$(grep '^version' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          # Replace the version string regardless of surrounding whitespace
          sed -i '' "s/^version[[:space:]]*=[[:space:]]*\"${CURRENT}\"/version = \"${NEW}\"/" Cargo.toml
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${CURRENT} → ${NEW}"

      - name: Commit & tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main --tags

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Rename artifacts
        run: |
          cp target/x86_64-apple-darwin/release/crucible crucible-x86_64-macos
          cp target/aarch64-apple-darwin/release/crucible crucible-aarch64-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            crucible-x86_64-macos
            crucible-aarch64-macos
