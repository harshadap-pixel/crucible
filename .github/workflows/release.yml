name: Release

on:
  push:
    branches: [main]

# Skip if this push is the bot's own version-bump commit
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    # Don't loop: skip the commit the bot just pushed
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # ── Compute new version (don't commit yet) ────────────────────────────
      # Increments patch and skips any versions whose tags already exist on
      # the remote (left over from previous failed runs).
      - name: Bump patch version in Cargo.toml
        id: version
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Walk forward until we find a patch that has no remote tag yet.
          # This handles stale tags left by previously failed release runs.
          while true; do
            PATCH=$((PATCH + 1))
            NEW="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${NEW}"
            if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
              break
            fi
            echo "Tag ${TAG} already exists on remote — skipping to next patch"
          done

          sed -i '' "s/^version[[:space:]]*=[[:space:]]*\"${CURRENT}\"/version = \"${NEW}\"/" Cargo.toml
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${CURRENT} → ${NEW}"

      # ── Build both arches — if either fails, we stop before tagging ───────
      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      # ── Only commit, tag, and push after a clean build ────────────────────
      - name: Commit & tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          # Pull any commits that landed while we were building, then push.
          git pull --rebase origin main
          git push origin main --tags

      - name: Rename artifacts
        run: |
          cp target/x86_64-apple-darwin/release/crucible crucible-x86_64-macos
          cp target/aarch64-apple-darwin/release/crucible crucible-aarch64-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            crucible-x86_64-macos
            crucible-aarch64-macos
