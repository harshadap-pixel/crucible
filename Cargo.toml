[package]
name        = "crucible"
version     = "0.2.0"
edition     = "2021"
authors     = ["Harshada Padhye <harshadapadhye5@gmail.com>"]
description = "Local-first LLM evaluation: quality, RAG, agents, safety, and mechanism detection in one binary"
license     = "Apache-2.0"
repository  = "https://github.com/harshadap-pixel/crucible"
keywords    = ["llm", "evaluation", "rag", "ollama", "ai-safety"]
categories  = ["command-line-utilities", "development-tools::testing"]
readme      = "README.md"

[lib]
name = "crucible"
path = "src/lib.rs"

[[bin]]
name = "crucible"
path = "src/main.rs"

[dependencies]
# async runtime
tokio        = { version = "1",    features = ["full"] }

# HTTP client
reqwest      = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# serialization
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# CLI
clap         = { version = "4",    features = ["derive", "color"] }

# assertions
regex        = "1"
jsonschema   = "0.26"

# storage — bundled sqlite, zero system dep
rusqlite     = { version = "0.31", features = ["bundled"] }

# terminal output
comfy-table  = "7"
colored      = "2"
indicatif    = "0.17"

# utils
chrono       = { version = "0.4",  features = ["serde"] }
uuid         = { version = "1",    features = ["v4"] }
anyhow       = "1"
thiserror    = "1"
async-trait  = "0.1"
rust-embed   = { version = "8", features = ["include-exclude"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
